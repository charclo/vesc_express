name: Build firmware

# Scoped to Claude's own working branches plus manual runs, so this
# doesn't change CI behavior for the rest of the repo without being asked.
# Broaden the `branches` filter (or add `pull_request`) if you want this
# to run more broadly.
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Espressif's official image for the ESP-IDF version this project
    # currently targets (see README.md) - comes with all toolchains
    # preinstalled, no need to run install.sh.
    container:
      image: espressif/idf:v5.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build all hardware targets
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 build_all.py

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesc_express-firmware
          path: build_output/
          if-no-files-found: ignore
